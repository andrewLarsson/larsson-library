<VirtualHost *:80>
    DocumentRoot /opt/larsson/www
    DirectoryIndex index.php index.html
    <Directory /opt/larsson/www>
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Larsson Library"
        AuthUserFile /run/secrets/library.htpasswd
        Require valid-user
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
